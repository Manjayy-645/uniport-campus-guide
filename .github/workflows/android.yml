name: Android prototype checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test admin/fields.test.mjs
      - run: node --check admin/cms.mjs
      - run: test -s node_modules/@supabase/supabase-js/dist/umd/supabase.js
      - run: npm run typecheck
      - run: npm run bundle:android
